<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui;padding:20px}
.card{background:#fff;padding:30px;border-radius:20px;width:100%;max-width:360px;text-align:center}
button{background:#22c55e;color:#fff;border:0;width:100%;padding:18px;border-radius:12px;font-size:18px;font-weight:800}
#qr{display:none}
#qr img{width:240px;margin:20px auto;display:block}
code{word-break:break-all;font-size:12px;background:#f0fdf4;padding:12px;display:block;border-radius:10px;margin-top:10px;border:1px dashed #22c55e}
</style>
</head>
<body>
<div class="card">
<div id="t1">
<h2>Pague no PIX - R$27</h2>
<p style="color:#666">Clique para gerar seu QR Code</p>
<button onclick="gerar()">GERAR QR CODE PIX</button>
</div>
<div id="qr">
<h2>Escaneie para pagar</h2>
<img id="img">
<code id="cod"></code>
<button style="margin-top:15px;background:#111" onclick="navigator.clipboard.writeText(document.getElementById('cod').innerText);this.innerText='COPIADO!'">COPIAR CÓDIGO</button>
</div>
</div>
<script>
function gerar(){
const CHAVE = "SUA CHAVE PIX AQUI";
document.getElementById('cod').innerText = CHAVE;
document.getElementById('img').src = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=" + encodeURIComponent(CHAVE);
document.getElementById('t1').style.display='none';
document.getElementById('qr').style.display='block';
}
</script>
</body>
</html>
